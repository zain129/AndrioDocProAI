databaseChangeLog:
  - changeSet:
      id: 003-create-refresh-tokens
      author: andriodocpro
      changes:
        - createTable:
            tableName: refresh_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: refresh_token
                  type: text
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: revoked
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
              - column:
                  name: updated_at
                  type: timestamptz
        - createIndex:
            indexName: idx_refresh_tokens_username
            tableName: refresh_tokens
            columns:
              - column:
                  name: username
